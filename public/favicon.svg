<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Koyu tarayıcı temasında siyah kutu sekme çubuğunda kayboluyor; orada
       kutu bir tık açılıp saç teli kenarlık kazanır. Sitedeki logoyla aynı
       değerler (bkz. global.css / Header.astro). Medya sorgusunu desteklemeyen
       ortamlar açık mod değerlerine düşer. -->
  <style>
    .tile { fill: #171717; stroke: none; }
    .dot { fill: #E50914; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #1C1C20; stroke: #34343C; stroke-width: 2; }
      .dot { fill: #FF4D57; }
    }
  </style>
  <rect class="tile" x="1" y="1" width="62" height="62" rx="13"/>
  <rect class="dot" x="28" y="8" width="8" height="8" rx="4"/>
  <path d="M28 24 Q28 21 31 21 L33 21 Q36 21 36 24 L36 50 L28 56 Z" fill="#FFFFFF"/>
</svg>
